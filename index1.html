                                </select>

                                    $(document).ready(function (){
                                    $.get( "http://localhost:8000/testr-api/discipline/", function( data ) {
                                        $( ".result" ).html( data );
                                        // console.log(data.results);
                                        // console.log(data.results[0].title);
                                        // console.log(document.getElementById("discipline"))
                                        //var dis=document.getElementById("discipline1").innerHtml;
                                        for(i=0;i<data.count;i++){
                                            $("#discipline1").append("<option class='dis-class' name = "+data.results[i].id+" value = "+data.results[i].title+">"+data.results[i].title+"</option");
                                        }
                                        });
                                        $("#discipline1").change(function()
                                        {
                                            var selectedCountry = $(this).children("option:selected").attr("name");
                                            alert("You have selected the country - " + selectedCountry);
                                        });
                                        
                                    })
                                </script>
                            </div>
                        </div>

                        <div class="page-title-heading" style="margin-left: 2%;">
                            <div>
                                <select  id="subject1" class="form-control">
                                    <option  value="" disabled selected>Subject</option>
                                </select>
                            </div>
                            <script>
                                $(document).ready(function (){
                                $.get( "http://localhost:8000/testr-api/subject/", function( data ) {
                                    $( ".result" ).html( data );
                                    // console.log(data.results);
                                    // console.log(data.results[0].title);
                                    // console.log(document.getElementById("discipline"))
                                   // var dis=document.getElementById("discipline").innerHtml
                                    for(i=0;i<data.count;i++){
                                        $("#subject1").append("<option class='dis-class' name = "+data.results[i].id+" value = "+data.results[i].title+">"+data.results[i].title+"</option");
                                    }
                                    });
                                    $("#subject1").change(function()
                                        {
                                            var selectedCountry = $(this).children("option:selected").attr("name");
                                            alert("You have selected the country - " + selectedCountry);
                                        });
                                        
                                })

                            </script>
                        </div>
                    </div>
                </div>

                    <div class="card-body">
                        <div class="tab-content" id="qna-area"></div>
                    </div>
