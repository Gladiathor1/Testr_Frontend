                                <!-- class="needs-validation" -->
                                <form id="signupForm" novalidate>
                                    <div class="form-row form-row2">
                                        <div class="col-md-12 mb-12">
                                            <label for="validationCustom01">User Name</label>
                                            <input type="text" class="form-control" id="validationCustom01" placeholder="John" required>
                                            <div class="invalid-feedback" id="field1">
                                                Please provide a valid Name.
                                            </div>
                                        </div>
                                        
                                        
                                        
                                    </div>
                                    <div class="form-row form-row2">
                                        <div class="col-md-12 mb-12">
                                            <label for="validationCustom03">Email</label>
                                            <input type="email" class="form-control" id="validationCustom03" placeholder="example@abc.com" required>
                                            <div class="invalid-feedback" id="field3">
                                                Please provide a valid Email.
                                            </div>
                                        </div>
                                        
                                        
                                    </div>
                                    <div class="form-row">
                                        <div class="col-md-12 mb-12">
                                            <label for="validationCustom03">Password</label>
                                            <input type="password" class="form-control" id="password1" placeholder="********" required>
                                            <div class="invalid-feedback" id="field4">
                                                Please provide a valid password. (must be greter than 8 characters and must be alphanumeric)
                                            </div>
                                        </div>
                                        
                                    </div>
                                    <div class="form-row">
                                        <div class="col-md-12 mb-12">
                                            <label for="validationCustom03">Confirm Password</label>
                                            <input type="password" class="form-control" id="password2" placeholder="********" required>
                                            <div class="invalid-feedback" id="field5">
                                                Password does not match.
                                            </div>
                                        </div>
                                        
                                    </div>
                                    <div class="form-group">
                                        <div class="form-group">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required="">
                                                <label class="form-check-label" for="invalidCheck">
                                                    Agree to terms and conditions
                                                </label>
                                                <div class="invalid-feedback" id="field6">
                                                    You must agree before submitting.
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <button class="btn btn-primary" type="submit">Sign Up</button>    
                                    </div>
                                    <br>
                                    <div class="form-row">
                                        <a class="login-signup" href="login.html">Already have an account? Login.</a>
                                    </div>
                                    
                                    
                                    
                                    <hr>
                                    <h6>Sign Up with:</h6>
                                    <br>

                                                <div class="fb-login-button" data-width="" data-onlogin="checkLoginState();"  data-scope="email" data-size="medium" data-button-type="continue_with" data-layout="default" data-auto-logout-link="false" data-use-continue-as="false"></div>
                                                
                                                <!-- <fb:login-button scope="public_profile,email" onlogin="checkLoginState();"></fb:login-button> -->
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-6">
                                            <div class="center-btn">
                                                <div class="g-signin2" data-onsuccess="onSignIn" data-theme="dark"></div>
                                                <!-- <a href="#" onclick="signOut();">Sign out</a> -->
                                            </div>
                                        </div>
                                    </div>
                                    
                                </form>
            
                                <script>
                                    // Example starter JavaScript for disabling form submissions if there are invalid fields
                                    (function() {
                                        'use strict';
                                        window.addEventListener('load', function() {
                                            // Fetch all the forms we want to apply custom Bootstrap validation styles to
                                            var forms = document.getElementsByClassName('needs-validation');
                                            // Loop over them and prevent submission
                                            var validation = Array.prototype.filter.call(forms, function(form) {
                                                form.addEventListener('submit', function(event) {
                                                    if (form.checkValidity() === false) {
                                                        event.preventDefault();
                                                        event.stopPropagation();
                                                    }
                                                    form.classList.add('was-validated');
                                                }, false);
                                            });
                                        }, false);
                                    })();
                                </script>
