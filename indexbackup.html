<script>
    $(document).ready(function () {
        $("#subbuton").click(function () {
            var ur = "http://127.0.0.1:8000/";
            var $text = CKEDITOR.instances['editor1'].getData();
            var $name = $('#name1');
            var $tag = $('#tag1').find(':selected').text();
            var $discipline = $('#discipline1');
            var $subject = $('#subject1');
            var $answer = CKEDITOR.instances['editor12'].getData();
            var paperval = ur + "testr-api/papers/1/";
            var subjectname = ur + "testr-api/subject/";
            var disciplinename = ur + "testr-api/discipline/";
            var questionname = ur + "testr-api/questions/";
            var tagname = ur + "testr-api/tag/";
            var papername = ur + "testr-api/papers/";


            console.log($text)
            console.log($name.val())
            console.log($tag)

            $.post(ur + 'testr-api/discipline/',
                {
                    title: $discipline.val()
                },
                function (data, status) {
                    console.log("Data: " + data + "\nStatus: " + status);

                    disciplinename += data.id + "/";

                });

            $.post(ur + 'testr-api/subject/',
                {
                    title: $subject.val()
                },
                function (data, status) {
                    console.log("Data: " + data + "\nStatus: " + status);

                    subjectname += data.id + "/";

                });

            $.post(ur + 'testr-api/tag/',
                {
                    name: $tag
                },
                function (data, status) {
                    console.log("Data: " + data + "\nStatus: " + status);

                    tagname += data.id + "/";
                    console.log(typeof data.id)
                    console.log(typeof tagname)
                    console.log(tagname)

                });


            $.post(ur + 'testr-api/questions/',
                {
                    name: $name.val(),
                    description: $text,

                    tag: tagname,
                    paper: papername
                },
                function (data, status) {
                    console.log("Data: " + data + "\nStatus: " + status);

                    console.log(data.id);
                    questionname += data.id + "/";
                    // if(status=="success"){
                    // location.reload();
                    // return false;
                    // }
                });


            $.post(ur + 'testr-api/answers/',
                {
                    question: questionname,
                    description: $answer
                },
                function (data, status) {
                    console.log("Data: " + data + "\nStatus: " + status);

                    console.log(data.id);
                    // if(status=="success"){
                    // location.reload();
                    // return false;
                    // }
                });


        });
    });
</script>
